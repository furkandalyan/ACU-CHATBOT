events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django_app {
        server web:8000;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;

        location /static/ {
            alias /app/staticfiles/;
            expires 1h;
            add_header Cache-Control "public";
        }

        location /api/health/ {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/chat/stream/ {
            limit_req zone=api_limit burst=4 nodelay;
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
        }

        location /api/ {
            limit_req zone=api_limit burst=8 nodelay;
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
