services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: acibadem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acibadem_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acibadem_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: acibadem_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: acibadem_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama
    container_name: acibadem_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull $$OLLAMA_MODEL &&
      ollama list"
    restart: "no"

  web:
    build: .
    container_name: acibadem_web
    restart: unless-stopped
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${GUNICORN_WORKERS:-3}", "--threads", "${GUNICORN_THREADS:-2}", "--timeout", "${GUNICORN_TIMEOUT:-120}"]
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-demo-key}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-acibadem_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DB_PORT: 5432
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      REDIS_URL: redis://redis:6379/1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-False}
      DJANGO_BUILD_EMBEDDINGS: ${DJANGO_BUILD_EMBEDDINGS:-0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-root}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-root@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-123}
      DJANGO_MIGRATE: ${DJANGO_MIGRATE:-1}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-1}
      DJANGO_SEED_MOCK_USERS: ${DJANGO_SEED_MOCK_USERS:-1}
      DJANGO_CREATE_SUPERUSER: ${DJANGO_CREATE_SUPERUSER:-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: acibadem_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 6

  scraper:
    build: .
    container_name: acibadem_scraper
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/scripts/run-scraper-loop.sh"]
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-demo-key}
      DEBUG: ${DJANGO_DEBUG:-False}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-acibadem_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DB_PORT: 5432
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-False}
      SCRAPER_ONLY: ${SCRAPER_ONLY:-bologna}
      SCRAPER_INTERVAL_SECONDS: ${SCRAPER_INTERVAL_SECONDS:-86400}

volumes:
  postgres_data:
  ollama_data:
  staticfiles:
